name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Backend Smoke + Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run smoke checks
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-ci-2026
        run: node scripts/ci-smoke.js

      - name: Run upload validation checks
        working-directory: backend
        run: node scripts/ci-uploads.js

      - name: Run tenant isolation checks
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-ci-2026
        run: node --test scripts/ci-tenant-isolation.js

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  lint_backend:
    name: Backend Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check all JS files
        working-directory: backend
        run: find src scripts -name "*.js" -exec node --check {} \;

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Audit backend dependencies
        run: node .github/scripts/audit.js backend

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        run: node .github/scripts/audit.js frontend

  migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: work_track_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: work_track_ci
      MYSQL_PWD: root
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Import production schema snapshot
        run: |
          iconv -f UTF-16LE -t UTF-8 backend/migrations/full_schema.sql \
            | sed -e '1s/^\xEF\xBB\xBF//' -e 's/DEFINER=`worktrack`@`localhost` //' \
            | mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root work_track_ci

      - name: Baseline and apply migrations
        working-directory: backend
        run: |
          node scripts/migrate.js --baseline-through=024
          node scripts/migrate.js

      - name: Verify migration ledger
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          node scripts/migrate.js --status | tee /tmp/migration-status.txt
          grep -q "0 pending" /tmp/migration-status.txt
          node scripts/migrate.js | grep -qx "No pending migrations."
          expected=$(find migrations -maxdepth 1 -name '[0-9][0-9][0-9]_*.sql' | wc -l)
          actual=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root -N -e \
            "SELECT COUNT(*) FROM schema_migrations" work_track_ci)
          test "$actual" -eq "$expected"

      - name: Verify hardening migration
        run: |
          count=$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root -N -e \
            "SELECT COUNT(*) FROM information_schema.STATISTICS
             WHERE TABLE_SCHEMA='work_track_ci'
               AND TABLE_NAME='holidays'
               AND INDEX_NAME='uniq_holiday_tenant_date'")
          test "$count" -ge 1

      - name: Detect a modified applied migration
        working-directory: backend
        run: |
          printf '\n-- drift check\n' >> migrations/025_tenant_isolation_hardening.sql
          if node scripts/migrate.js --status > /tmp/drift.log 2>&1; then
            echo "Expected the runner to reject a modified migration"
            exit 1
          fi
          grep -q "modified after it was applied" /tmp/drift.log
          git checkout -- migrations/025_tenant_isolation_hardening.sql

      - name: Plan a fresh database
        working-directory: backend
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root -e "CREATE DATABASE work_track_plan"
          DB_NAME=work_track_plan node scripts/migrate.js --dry-run | tee /tmp/plan.log
          grep -q "Would apply" /tmp/plan.log

      - name: Restore drill
        working-directory: backend
        env:
          MYSQL_PWD: root
        run: |
          mkdir -p backups
          docker exec -e MYSQL_PWD=root "${{ job.services.mariadb.id }}" \
            mariadb-dump -uroot --single-transaction --routines --triggers --events \
              --add-drop-table work_track_ci | gzip > backups/ci-drill.sql.gz
          SKIP_DOTENV=true WORKTRACK_HOME="$PWD/.." \
            DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=root DB_PASSWORD=root DB_NAME=work_track_ci \
            bash scripts/restore.sh backups/ci-drill.sql.gz
          rm -f backups/ci-drill.sql.gz

  deploy_staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, build, lint_backend, audit, migrations]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.STAGING_ENABLED == 'true'
    environment: staging
    concurrency:
      group: deploy_staging
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            cd "$HOME/WorkTrack-staging"
            git fetch origin main
            SCRIPT=$(mktemp /tmp/worktrack-deploy.XXXXXX.sh)
            trap 'rm -f "$SCRIPT"' EXIT
            git show origin/main:scripts/deploy.sh > "$SCRIPT"
            HEALTH_URL="${{ vars.STAGING_HEALTH_URL }}"
            HEALTH_URL="${HEALTH_URL:-http://127.0.0.1:5001/api/health}"
            APP_DIR="$HOME/WorkTrack-staging" \
            HEALTH_URL="$HEALTH_URL" \
            PM2_APP="${{ vars.STAGING_PM2_APP }}" \
            bash "$SCRIPT"

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, build, lint_backend, audit, migrations, deploy_staging]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      needs.lint_backend.result == 'success' &&
      needs.audit.result == 'success' &&
      needs.migrations.result == 'success' &&
      (needs.deploy_staging.result == 'success' || needs.deploy_staging.result == 'skipped')
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            cd "$HOME/WorkTrack"
            git fetch origin main
            SCRIPT=$(mktemp /tmp/worktrack-deploy.XXXXXX.sh)
            trap 'rm -f "$SCRIPT"' EXIT
            git show origin/main:scripts/deploy.sh > "$SCRIPT"
            APP_DIR="$HOME/WorkTrack" \
            HEALTH_URL="https://worktrack.ddns.net/api/health" \
            MIGRATION_BASELINE="024" \
            bash "$SCRIPT"
