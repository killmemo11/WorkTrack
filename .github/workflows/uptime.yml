name: Uptime Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  readiness:
    name: Production Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UPTIME_URL: ${{ vars.UPTIME_URL || 'https://worktrack.ddns.net/api/health/ready' }}
      UPTIME_WEBHOOK_URL: ${{ secrets.UPTIME_WEBHOOK_URL }}
    steps:
      - name: Check readiness endpoint
        id: check
        run: |
          set -euo pipefail
          url="${UPTIME_URL:-https://worktrack.ddns.net/api/health/ready}"
          body=$(mktemp)
          code=$(curl -sS --max-time 15 --retry 3 --retry-delay 10 --retry-connrefused \
            -o "$body" -w '%{http_code}' "$url" || true)
          echo "HTTP $code from $url"
          cat "$body" || true
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "200" ]; then
            echo "::error::Readiness check failed with HTTP $code"
            exit 1
          fi
          if ! grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' "$body"; then
            echo "::error::Response did not report status=ok"
            exit 1
          fi

      - name: Notify webhook
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${UPTIME_WEBHOOK_URL:-}" ]; then
            echo "No UPTIME_WEBHOOK_URL configured; skipping notification."
            exit 0
          fi
          payload=$(jq -n \
            --arg text "WorkTrack readiness check failed at ${UPTIME_URL:-production}. See ${RUN_URL}" \
            '{text: $text}')
          curl -fsS --max-time 10 -X POST \
            -H 'Content-Type: application/json' \
            -d "$payload" "$UPTIME_WEBHOOK_URL"
